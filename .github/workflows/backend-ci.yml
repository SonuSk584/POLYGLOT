name: Backend CI

# Runs on every push and pull request targeting main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get your code onto the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Java 17 (matches your pom.xml java.version)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Step 3: Compile the project and package the jar
      # Tests are skipped for now since the default Spring context test
      # requires live secrets (MongoDB, Firebase, JWT) not available in CI yet
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Step 4: Confirm the Docker image itself builds successfully
      # This catches Dockerfile errors before they'd ever reach deployment
      - name: Build Docker image
        run: docker build -t polyglot-chat-backend:ci-test .